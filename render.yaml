# Render Blueprint.
#
# This deploys as a STATIC SITE, with no Python running in production. The
# dataset only changes when someone deliberately re-runs the pipeline, so a
# server would be a request-time proxy for a file that is already final at
# build time. It also avoids the free-tier spin-down: a free *web service*
# sleeps after 15 minutes idle and takes about a minute to wake, which is
# exactly the state it would be in when someone opens the link during a
# presentation. Static sites are served from the CDN and do not idle.
#
# Consequence worth stating plainly: ANTHROPIC_API_KEY never exists in this
# environment. The enrichment ran once, on a laptop, and its output is in git.

services:
  - type: web
    runtime: static
    name: patching-the-ai-stack
    branch: main

    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    pullRequestPreviewsEnabled: true

    # Don't rebuild the site when only the pipeline or the notebooks change.
    buildFilter:
      paths:
        - web/**
        - render.yaml
      ignoredPaths:
        - web/**/*.md

    routes:
      # SPA fallback. Render only applies a route rule when no file exists at
      # the path, so /assets/* and /data/* are served directly and are not
      # swallowed by this rewrite.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # The bundle is hashed by Vite and the data artifacts are hashed by the
      # pipeline, so both are safe to cache permanently.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/detail/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # The one unhashed file.
      - path: /index.html
        name: Cache-Control
        value: no-cache
